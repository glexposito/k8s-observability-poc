# queue-consumer guardrails, identical on every workload cluster except the
# pod count, which tracks that stage's replicas: overlays/<cluster>/quota.yaml.
# k3s's embedded kube-router enforces the NetworkPolicy.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: queue-consumer-quota
  namespace: queue-consumer
spec:
  hard:
    requests.cpu: 500m
    requests.memory: 512Mi
    limits.cpu: "1"
    limits.memory: 1Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: default-limits
  namespace: queue-consumer
spec:
  limits:
    - type: Container
      default:
        cpu: 100m
        memory: 64Mi
      defaultRequest:
        cpu: 10m
        memory: 16Mi
---
# A worker: it only makes outbound connections (OTLP to the node's
# otel-agent), so it accepts nothing from outside its namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace-only
  namespace: queue-consumer
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
