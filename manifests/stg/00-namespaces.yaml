# Workload namespaces on stg. Each cluster is one environment, so names carry
# no stage suffix: queue-consumer is "queue-consumer" on every cluster, and
# deployment.environment.name (stamped by the otel-agent) tells the
# environments apart in telemetry. See docs/architecture.md.
apiVersion: v1
kind: Namespace
metadata:
  name: queue-consumer
  labels:
    environment: stg
    stage: stg
    cost-center: cc-2000
    managed-by: k8s-observability-poc
