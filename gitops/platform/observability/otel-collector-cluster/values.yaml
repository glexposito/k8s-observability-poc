# The Deployment collector: one replica per workload cluster
# (gitops/argocd/applications/otel-collectors-appset.yaml), next to the
# DaemonSet one (otel-collector). Named and set up as in OpenTelemetry's
# Kubernetes getting-started guide: https://opentelemetry.io/docs/platforms/kubernetes/getting-started/
#
# It reports what Kubernetes itself knows about the cluster, read from the
# Kubernetes API - the OpenTelemetry counterpart of kube-state-metrics:
#   - k8s_cluster: the current state of Kubernetes objects, as metrics -
#     desired vs available replicas, pod phases, container restarts, node
#     conditions, job results
#   - k8s_events: Kubernetes events (BackOff, FailedScheduling, OOMKilling...),
#     as logs
# That has to happen exactly once per cluster - in the guide's words, "a
# deployment with exactly one replica ensures that we don't produce duplicate
# data". Same identity tagging and same gateway export as otel-collector.
# (The chart README notes more replicas are possible: leader election then
# keeps a single active one.)
fullnameOverride: otel-collector-cluster
mode: deployment
replicaCount: 1

image:
  repository: otel/opentelemetry-collector-k8s

presets:
  clusterMetrics:
    enabled: true
  kubernetesEvents:
    enabled: true
    # k8s_events turns each event into a plain log: body = event message,
    # severity = Normal/Warning, k8s.event.reason / k8s.object.* as fields.
    # (The default, k8sobjects, ships the raw API object as a JSON body.)
    useK8sEventsReceiver: true

# Nothing pushes to this collector, so it has no listeners and no Service.
service:
  enabled: false

ports:
  otlp:
    enabled: false
  otlp-http:
    enabled: false
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

config:
  receivers:
    otlp: null
    jaeger: null
    zipkin: null
    prometheus: null

  processors:
    resource/cluster:
      attributes:
        - key: k8s.cluster.name
          value: ${env:CLUSTER_NAME}
          action: upsert
        - key: deployment.environment.name
          value: ${env:ENVIRONMENT}
          action: upsert

  exporters:
    otlp/gateway:
      # Endpoint and TLS: values-local.yaml, same as the node agent.
      sending_queue:
        enabled: true
        queue_size: 2000
      retry_on_failure:
        enabled: true

  service:
    pipelines:
      # Receivers come from the presets (k8s_cluster, k8s_events).
      traces: null
      metrics:
        receivers: []
        processors: [memory_limiter, resource/cluster, batch]
        exporters: [otlp/gateway]
      logs:
        receivers: []
        processors: [memory_limiter, resource/cluster, batch]
        exporters: [otlp/gateway]
