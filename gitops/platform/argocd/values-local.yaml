# Laptop-only Argo CD settings, layered on top of values.yaml.
#
# Fixed admin/123 login and a NodePort so the UI is reachable as soon as
# Argo CD has synced itself - no kubectl port-forward, nothing to run by hand.
# Weak on purpose; this never leaves 127.0.0.1 (see local/compose.yaml's
# management port mapping).
# Hash generated with:
#   docker run --rm httpd:2.4-alpine htpasswd -nbBC 10 "" 123 | tr -d ':\n'
configs:
  # Argo CD's external URL - used in CLI output and notification links.
  # The chart's default (from global.domain) is argocd.example.com.
  cm:
    url: https://127.0.0.1:9000
  secret:
    argocdServerAdminPassword: "$2a$10$zG/yvDMqlg9VStNvqCftBe3UVYc53FK5Gh47BWpeMuBl4vYQf3ini"
    argocdServerAdminPasswordMtime: "2024-01-01T00:00:00Z"
server:
  service:
    type: NodePort
    nodePortHttps: 30090
