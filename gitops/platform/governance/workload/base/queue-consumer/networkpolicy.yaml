# A worker: it only makes outbound connections (OTLP to the node's
# otel-collector), so it accepts nothing from outside its namespace.
# k3s's embedded kube-router enforces it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace-only
  namespace: queue-consumer
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
