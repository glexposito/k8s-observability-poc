# The OpenTelemetry collection layer on each workload cluster: the otel-collector
# DaemonSet and the otel-collector-cluster Deployment
# (gitops/argocd/applications/otel-collectors-appset.yaml). Both forward to
# the gateway on management (namespace otel-gateway there).
#
# Each cluster is one environment, so names carry no stage suffix; the
# environment label comes from overlays/<env> (docs/namespaces.md).
apiVersion: v1
kind: Namespace
metadata:
  name: otel-collectors
  labels:
    platform.example.com/team: platform
    platform.example.com/cost-center: cc-1000
