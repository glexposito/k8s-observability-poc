# The OpenTelemetry collection layer on each workload cluster: the otel-agent
# DaemonSet and the otel-k8s-state collector
# (gitops/argocd/applications/otel-collectors-appset.yaml). Both forward to
# the gateway on management (namespace otel-gateway there).
#
# Each cluster is one environment, so names carry no stage suffix; the
# environment/stage labels come from overlays/<env> (docs/namespaces.md).
apiVersion: v1
kind: Namespace
metadata:
  name: otel-collectors
  labels:
    team: platform
    cost-center: cc-1000
    managed-by: k8s-observability-poc
