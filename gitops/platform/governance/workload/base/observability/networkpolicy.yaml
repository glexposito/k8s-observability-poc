# Apps in every namespace push OTLP to the agent on their node
# (hostPort 4317/4318, OTEL_EXPORTER_OTLP_ENDPOINT=http://$(NODE_IP):4318),
# so those two ports are open to all sources. Everything else stays
# same-namespace only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace-and-otlp
  namespace: observability
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
    - ports:
        - port: 4317
          protocol: TCP
        - port: 4318
          protocol: TCP
