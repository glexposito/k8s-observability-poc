# The OpenTelemetry gateway (gitops/argocd/applications/otel-gateway.yaml),
# which every workload cluster's collectors (namespace otel-collectors there)
# send to, and which fans out to SigNoz (signoz namespace) and LGTM (a Compose
# service, local/compose.yaml).
apiVersion: v1
kind: Namespace
metadata:
  name: otel-gateway
  labels:
    platform.example.com/team: platform
    platform.example.com/environment: management
    platform.example.com/cost-center: cc-1000
