# management is a dedicated platform cluster: it runs only Argo CD, no
# workload tenants - not a promotion stage, so it carries no
# environment=internal/stg/prod label of its own. `argocd` is a fixed
# platform namespace: the Argo CD installer creates it, and this file only
# adds its labels.
apiVersion: v1
kind: Namespace
metadata:
  name: argocd
  labels:
    team: platform
    environment: management
    stage: management
    cost-center: cc-1000
    managed-by: k8s-observability-poc
