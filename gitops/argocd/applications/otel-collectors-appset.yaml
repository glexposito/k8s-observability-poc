# The collection layer: every workload cluster (cluster Secrets labelled
# role=workload) × the two collectors, so 6 Applications here
# (otel-collector-prod, otel-collector-cluster-prod, ...). Each one sends
# OTLP to the gateway on management (applications/otel-gateway.yaml) and knows
# nothing about backends. Two collectors, named as in OpenTelemetry's
# Kubernetes getting-started guide (https://opentelemetry.io/docs/platforms/kubernetes/getting-started/):
#   collector         - DaemonSet, one per node: its own node (app OTLP,
#                       kubelet stats, pod logs)
#   collector-cluster - Deployment, 1 replica: the Kubernetes API (object
#                       state and events). Once per cluster, since a
#                       DaemonSet would report every object once per node.
#
# Upstream OpenTelemetry chart. Values live in git through a multi-source
# `$values` ref: gitops/platform/observability/otel-<component>/values.yaml,
# plus values-<provider>.yaml from the cluster's provider label (how that kind
# of cluster reaches the gateway). The other per-cluster inputs come from the
# cluster Secret: CLUSTER_NAME (its name) becomes k8s.cluster.name and
# ENVIRONMENT (its environment label) becomes deployment.environment.name on
# every signal. Two prod clusters share the environment, not the name.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: otel-collectors-appset
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  platform.example.com/role: workload
          - list:
              elements:
                - component: collector
                - component: collector-cluster
  template:
    metadata:
      name: 'otel-{{.component}}-{{.name}}'
      namespace: argocd
      labels:
        platform.example.com/environment: '{{index .metadata.labels "platform.example.com/environment"}}'
        platform.example.com/layer: observability
    spec:
      project: platform
      sources:
        - repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
          chart: opentelemetry-collector
          targetRevision: 0.183.2 # collector 0.165.0
          helm:
            releaseName: 'otel-{{.component}}'
            valueFiles:
              - '$values/gitops/platform/observability/otel-{{.component}}/values.yaml'
              # Per kind of cluster: values-local.yaml for k3s in Docker.
              - '$values/gitops/platform/observability/otel-{{.component}}/values-{{index .metadata.labels "platform.example.com/provider"}}.yaml'
            # A provider without its own file just gets values.yaml.
            ignoreMissingValueFiles: true
            valuesObject:
              extraEnvs:
                - name: CLUSTER_NAME
                  value: '{{.name}}'
                - name: ENVIRONMENT
                  value: '{{index .metadata.labels "platform.example.com/environment"}}'
        - repoURL: https://github.com/glexposito/k8s-observability-poc.git
          targetRevision: HEAD
          ref: values
      destination:
        server: '{{.server}}'
        namespace: otel-collectors
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
