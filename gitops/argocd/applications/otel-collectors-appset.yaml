# The collection layer (OpenTelemetry's agent pattern): every workload cluster
# (cluster Secrets labelled role=workload) × {agent, k8s-state}, so 6
# Applications here (otel-agent-prod, otel-k8s-state-prod, ...). Each one sends
# OTLP to the gateway on management (applications/otel-gateway.yaml) and knows
# nothing about backends.
#   agent     - DaemonSet, one per node: app OTLP, kubelet stats, pod logs
#   k8s-state - Deployment, 1 replica: Kubernetes object state from the API
#               (k8s_cluster) and events. Collected once per cluster, since a
#               DaemonSet would report every object once per node.
#
# Upstream OpenTelemetry chart. Values live in git through a multi-source
# `$values` ref: gitops/platform/observability/otel-<component>/values.yaml,
# plus values-<provider>.yaml from the cluster's provider label (how that kind
# of cluster reaches the gateway). The only other per-cluster input is
# CLUSTER_NAME, which becomes k8s.cluster.name and deployment.environment.name
# on every signal.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: otel-collectors-appset
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  platform.example.com/role: workload
          - list:
              elements:
                - component: agent
                - component: k8s-state
  template:
    metadata:
      name: 'otel-{{.component}}-{{.name}}'
      namespace: argocd
      labels:
        environment: '{{index .metadata.labels "platform.example.com/environment"}}'
        layer: observability
    spec:
      project: platform
      sources:
        - repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
          chart: opentelemetry-collector
          targetRevision: 0.183.2 # collector 0.165.0
          helm:
            releaseName: 'otel-{{.component}}'
            valueFiles:
              - '$values/gitops/platform/observability/otel-{{.component}}/values.yaml'
              # Per kind of cluster: values-local.yaml for k3s in Docker.
              - '$values/gitops/platform/observability/otel-{{.component}}/values-{{index .metadata.labels "platform.example.com/provider"}}.yaml'
            # A provider without its own file just gets values.yaml.
            ignoreMissingValueFiles: true
            valuesObject:
              extraEnvs:
                - name: CLUSTER_NAME
                  value: '{{.name}}'
        - repoURL: https://github.com/glexposito/k8s-observability-poc.git
          targetRevision: HEAD
          ref: values
      destination:
        server: '{{.server}}'
        namespace: otel-collectors
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
