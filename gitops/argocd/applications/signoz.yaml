# SigNoz on management: one OTLP backend behind the gateway. UI at
# http://127.0.0.1:3301. Values: gitops/platform/observability/signoz/.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: signoz
  namespace: argocd
  labels:
    environment: management
    layer: observability
spec:
  project: platform
  sources:
    - repoURL: https://charts.signoz.io
      chart: signoz
      targetRevision: 0.151.0
      helm:
        releaseName: signoz
        valueFiles:
          - $values/gitops/platform/observability/signoz/values.yaml
          - $values/gitops/platform/observability/signoz/values-local.yaml
    - repoURL: https://github.com/glexposito/k8s-observability-poc.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: signoz
  # Fields the API server defaults but the chart doesn't set. Without these the
  # app shows OutOfSync forever with nothing to sync: `divisor: 0` on the
  # clickhouse-operator's resourceFieldRef env vars, and apiVersion/kind on the
  # StatefulSets' volumeClaimTemplates.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: signoz-clickhouse-operator
      jqPathExpressions:
        - .spec.template.spec.containers[].env[]?.valueFrom?.resourceFieldRef?.divisor
    - group: apps
      kind: StatefulSet
      jqPathExpressions:
        - .spec.volumeClaimTemplates[]?.apiVersion
        - .spec.volumeClaimTemplates[]?.kind
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # ClickHouse runs through the Altinity operator. Its CRDs are large
      # (client-side apply's last-applied annotation can exceed the size
      # limit), and the ClickHouseInstallation can't be dry-run before its
      # CRD exists on the first sync.
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
