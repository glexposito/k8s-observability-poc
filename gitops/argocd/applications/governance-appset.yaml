# One Application per cluster, syncing its governance layer (namespaces,
# quotas, network policies) from gitops/platform/governance/. The workload is
# handled separately by queue-consumer-appset.yaml.
#   - internal/stg/prod: the Kustomize overlay workload/overlays/<env>.
#   - management: management/ (its own namespaces and quotas) - Argo CD
#     manages the cluster it runs on too.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: clusters-appset
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - cluster: internal
            server: https://k3s-internal:6443
            path: gitops/platform/governance/workload/overlays/internal
          - cluster: stg
            server: https://k3s-stg:6443
            path: gitops/platform/governance/workload/overlays/stg
          - cluster: prod
            server: https://k3s-prod:6443
            path: gitops/platform/governance/workload/overlays/prod
          - cluster: management
            server: https://kubernetes.default.svc
            path: gitops/platform/governance/management
  template:
    metadata:
      name: 'manifests-{{cluster}}'
      namespace: argocd
      labels:
        environment: '{{cluster}}'
        layer: governance
    spec:
      project: platform
      source:
        repoURL: https://github.com/glexposito/k8s-observability-poc.git
        targetRevision: HEAD
        path: '{{path}}'
      destination:
        server: '{{server}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
