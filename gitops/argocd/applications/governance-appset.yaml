# One Application per cluster, syncing its governance layer (namespaces,
# quotas, network policies) from gitops/platform/governance/. The workload is
# handled separately by queue-consumer-appset.yaml.
#
# Clusters come from Argo CD's cluster Secrets, selected by label (see
# docs/architecture.md, "Cluster labels"), so a new cluster only needs a
# labelled Secret:
#   - role=workload:   the Kustomize overlay workload/overlays/<environment>.
#   - role=management: management/ (its own namespaces and quotas) - Argo CD
#     manages the cluster it runs on too.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: governance-appset
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            platform.example.com/role: workload
        values:
          path: 'gitops/platform/governance/workload/overlays/{{index .metadata.labels "platform.example.com/environment"}}'
    - clusters:
        selector:
          matchLabels:
            platform.example.com/role: management
        values:
          path: gitops/platform/governance/management
  template:
    metadata:
      name: 'governance-{{.name}}'
      namespace: argocd
      labels:
        platform.example.com/environment: '{{index .metadata.labels "platform.example.com/environment"}}'
        platform.example.com/layer: governance
    spec:
      project: platform
      source:
        repoURL: https://github.com/glexposito/k8s-observability-poc.git
        targetRevision: HEAD
        path: '{{.values.path}}'
      destination:
        server: '{{.server}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
