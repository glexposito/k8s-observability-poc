# One queue-consumer Application per workload cluster (cluster Secrets
# labelled role=workload), each syncing the overlay for that cluster's
# environment label: 1 / 2 / 3 replicas. Every overlay deploys to the same
# queue-consumer namespace. The environment shows up in telemetry as
# deployment.environment.name, stamped by the otel-agent, not in names.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: queue-consumer-appset
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            platform.example.com/role: workload
        values:
          environment: '{{index .metadata.labels "platform.example.com/environment"}}'
  template:
    metadata:
      # Per cluster, not per environment: two prod clusters get two Applications.
      name: 'queue-consumer-{{.name}}'
      namespace: argocd
      labels:
        stage: '{{.values.environment}}'
        environment: '{{.values.environment}}'
    spec:
      project: queue-consumer
      source:
        repoURL: https://github.com/glexposito/k8s-observability-poc.git
        targetRevision: HEAD
        path: 'gitops/apps/queue-consumer/overlays/{{.values.environment}}'
      destination:
        server: '{{.server}}'
        namespace: queue-consumer
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
