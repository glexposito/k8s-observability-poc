# queue-consumer: restricted to its own namespace on each workload cluster,
# with no cluster-scoped access.
#
# sync-wave -1 so it exists before queue-consumer-appset.yaml generates
# Applications that reference it (an Application referencing a missing
# project fails validation).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: queue-consumer
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: queue-consumer - owns the queue-consumer namespace on each cluster only.
  sourceRepos:
    - https://github.com/glexposito/k8s-observability-poc.git
  # Its own namespace on any registered cluster except management. A
  # destination is allowed only if an allow rule matches and no `!` rule
  # rejects it, so the second entry is a deny, not an extra allow.
  destinations:
    - server: '*'
      namespace: queue-consumer
    - server: '!https://kubernetes.default.svc'
      namespace: '*'
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: apps
      kind: Deployment
    - group: apps
      kind: ReplicaSet
    - group: ''
      kind: Pod
