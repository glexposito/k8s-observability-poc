# Shared by every stage. overlays/<stage> only sets the replica count and
# pins the image that stage runs.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
labels:
  - pairs:
      app.kubernetes.io/name: queue-consumer
    includeSelectors: true
  - pairs:
      app.kubernetes.io/component: worker
      # The tenant it belongs to (its namespace). With business domains this
      # is the domain, e.g. domain-1.
      app.kubernetes.io/part-of: queue-consumer
    # On the pods too (not only the Deployment), where k8s_attributes and
    # `kubectl get pods -l` see them. Not in the selector, which is immutable.
    includeTemplates: true
