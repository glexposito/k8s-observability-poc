# One Application per cluster, syncing its governance layer (namespaces,
# quotas, RBAC, network policies) from this repo. The workload is handled
# separately by queue-consumer-appset.yaml.
#   - internal/stg/prod: the Kustomize overlay manifests/overlays/<cluster>,
#     which includes manifests/bootstrap/ (also applied by k3s at startup).
#   - management: plain manifests/management/ (its own namespaces/quota/
#     CoreDNS) - Argo CD self-manages the cluster it runs on too.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: clusters-appset
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - cluster: internal
            server: https://k3s-internal:6443
            path: manifests/overlays/internal
          - cluster: stg
            server: https://k3s-stg:6443
            path: manifests/overlays/stg
          - cluster: prod
            server: https://k3s-prod:6443
            path: manifests/overlays/prod
          - cluster: management
            server: https://kubernetes.default.svc
            path: manifests/management
  template:
    metadata:
      name: 'manifests-{{cluster}}'
      namespace: argocd
      labels:
        environment: '{{cluster}}'
        layer: governance
    spec:
      project: platform
      source:
        repoURL: https://github.com/glexposito/k8s-observability-poc.git
        targetRevision: HEAD
        path: '{{path}}'
      destination:
        server: '{{server}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
