# SigNoz dashboards from git (observability/dashboards/signoz): a ConfigMap of
# dashboard JSON plus a PostSync Job that imports it through SigNoz's API.
# Any change to a dashboard JSON there re-runs the import.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: signoz-dashboards
  namespace: argocd
  labels:
    environment: management
    layer: observability
spec:
  project: platform
  source:
    repoURL: https://github.com/glexposito/k8s-observability-poc.git
    targetRevision: HEAD
    path: observability/dashboards/signoz
  destination:
    server: https://kubernetes.default.svc
    namespace: signoz
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
