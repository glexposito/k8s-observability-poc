# SigNoz on management: one OTLP backend behind the gateway. UI at
# http://localhost:3301. Values: observability/signoz/values.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: signoz
  namespace: argocd
  labels:
    environment: management
    layer: observability
spec:
  project: platform
  sources:
    - repoURL: https://charts.signoz.io
      chart: signoz
      targetRevision: 0.151.0
      helm:
        releaseName: signoz
        valueFiles:
          - $values/observability/signoz/values.yaml
    - repoURL: https://github.com/glexposito/k8s-observability-poc.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: signoz
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # ClickHouse runs through the Altinity operator. Its CRDs are large
      # (client-side apply's last-applied annotation can exceed the size
      # limit), and the ClickHouseInstallation can't be dry-run before its
      # CRD exists on the first sync.
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
