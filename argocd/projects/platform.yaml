# Platform-owned: namespace/quota/RBAC governance (manifests-internal,
# manifests-stg, manifests-prod, manifests-management) and the observability
# stack. This is the layer with cluster-scoped access, kept separate from the
# queue-consumer project, which gets none at all.
#
# sync-wave -1 so this (and the queue-consumer AppProject) get created
# before the ApplicationSets try to generate Applications that reference
# them. An Application referencing a project that doesn't exist yet fails
# validation.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: >-
    Namespace/quota/RBAC governance, the observability stack, and the
    app-of-apps bootstrap itself. Not for workloads - see the
    queue-consumer project.
  sourceRepos:
    - https://github.com/glexposito/k8s-observability-poc.git
    # Observability (argocd/otel-*.yaml, argocd/signoz.yaml): the upstream
    # OpenTelemetry Collector chart and SigNoz's chart.
    - https://open-telemetry.github.io/opentelemetry-helm-charts
    - https://charts.signoz.io
  destinations:
    - server: https://kubernetes.default.svc
      namespace: '*'
    - server: https://k3s-internal:6443
      namespace: '*'
    - server: https://k3s-stg:6443
      namespace: '*'
    - server: https://k3s-prod:6443
      namespace: '*'
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
    # Collectors (k8sattributes, k8s_cluster, kubelet stats) and the
    # ClickHouse operator need cluster-wide read access.
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    # SigNoz's ClickHouse operator CRDs (ClickHouseInstallation, ...).
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
