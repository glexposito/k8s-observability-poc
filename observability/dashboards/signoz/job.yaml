# Imports the dashboards in this folder into SigNoz (see import.sh). An Argo CD
# PostSync hook, so it runs after every sync of the signoz-dashboards
# Application, i.e. whenever a dashboard JSON changes in git. The previous run
# is deleted first (BeforeHookCreation), because Job specs are immutable.
apiVersion: batch/v1
kind: Job
metadata:
  name: signoz-dashboards-import
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  # SigNoz can take several minutes to come up on a fresh stack.
  activeDeadlineSeconds: 1800
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: import
          image: docker.io/library/alpine:3.22
          command: ["/bin/sh", "/scripts/import.sh"]
          env:
            - name: SIGNOZ_EMAIL
              valueFrom:
                secretKeyRef:
                  name: signoz-dashboards-login
                  key: email
            - name: SIGNOZ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: signoz-dashboards-login
                  key: password
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: dashboards
              mountPath: /dashboards
      volumes:
        - name: scripts
          configMap:
            name: signoz-dashboards-import
        - name: dashboards
          configMap:
            name: signoz-dashboards
