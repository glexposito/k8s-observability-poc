# SigNoz on management (argocd/signoz.yaml): one OTLP backend fed by the
# gateway. Its bundled signoz-otel-collector is only SigNoz's ingestion
# endpoint (it writes to ClickHouse). It is not our gateway, so LGTM never
# depends on SigNoz being healthy.
#
# Chart defaults everywhere else: ClickHouse via the Altinity operator,
# ZooKeeper, schema migrator, all on k3s's local-path StorageClass.
clusterName: management

signoz:
  service:
    type: NodePort
    # UI, published on the host as localhost:3301 (docker-compose.yaml).
    nodePort: 30301
  env:
    # Used in alert notification links; must match the host port above.
    signoz_alertmanager_signoz_external__url: http://localhost:3301
    # Root admin created by SigNoz itself on startup (user.root.* config), so
    # there is no sign-up step and the login is known. PoC-only fixed
    # credentials, same idea as Argo CD's admin/123: this never leaves
    # localhost. SigNoz requires 12+ chars with upper, lower, digit and symbol.
    # Only applies to a fresh SigNoz database: an org created through the UI
    # sign-up isn't matched by name, so reset with `docker compose down -v`.
    signoz_user_root_enabled: true
    signoz_user_root_email: admin@playground.local
    signoz_user_root_password: Playground123!
