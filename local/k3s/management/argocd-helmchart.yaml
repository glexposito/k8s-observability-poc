# Laptop-only first install of Argo CD: k3s's helm-controller applies this
# HelmChart at startup (local/compose.yaml mounts k3s/management/ into its
# manifests folder). On AKS, the cluster provisioning does this instead
# (e.g. Terraform's helm_release).
#
# Bootstrap only. Argo CD then manages itself from git
# (gitops/argocd/applications/argocd.yaml + gitops/argocd/install/), so this
# holds just what must already match before that first self-sync:
#   - the chart version: keep it in step with the Application's
#     targetRevision (if they drift, Argo CD upgrades itself to the git one).
#   - fullnameOverride: resource names must match, or the self-sync would
#     create a second Argo CD next to this one.
# Everything else (resources, NodePort, login, URL) comes from git.
#
# Don't change Argo CD here after bootstrap: k3s re-runs its Helm job when
# this file changes, which would briefly undo what Argo CD applied from git.
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: argocd
  namespace: kube-system
spec:
  repo: https://argoproj.github.io/argo-helm
  chart: argo-cd
  version: 10.20.0 # Argo CD v3.6.3
  targetNamespace: argocd
  createNamespace: true
  timeout: 600s
  # Keep an existing release on failure instead of uninstalling it and retrying.
  failurePolicy: abort
  valuesContent: |-
    fullnameOverride: argocd
