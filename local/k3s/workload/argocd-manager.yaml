# ServiceAccount Argo CD (running in the management cluster's argocd
# namespace) authenticates as when it manages this cluster remotely.
# cluster-admin is used here for PoC simplicity - a real deployment would
# scope this down to just the namespaces/resources Argo CD actually needs.
#
# Laptop-only: k3s applies this at startup, before Argo CD can reach the
# cluster. Each cluster generates its own token, so it can't be a static file
# on management; local/register-clusters.sh (the argocd-bootstrap Compose
# service) copies it into management on `docker compose up -d`. The token
# persists with the cluster volume.
# If just this cluster's volume gets rebuilt (not a fresh `up -d` of the
# whole stack), rerun with `docker compose up -d --force-recreate
# argocd-bootstrap` to re-register it - the bootstrap container itself
# won't recreate on its own just because a service it depends on changed.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-manager
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argocd-manager-role-binding
subjects:
  - kind: ServiceAccount
    name: argocd-manager
    namespace: kube-system
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Secret
metadata:
  name: argocd-manager-token
  namespace: kube-system
  annotations:
    kubernetes.io/service-account.name: argocd-manager
type: kubernetes.io/service-account-token
