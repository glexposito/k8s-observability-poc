# Laptop-only, applied by k3s at startup. Static CoreDNS override so pods can resolve k3s-management, where the
# OpenTelemetry collectors export to the gateway (k3s-management:30317).
# Docker's embedded DNS resolves it for containers but doesn't reach inside a
# pod's network namespace, so CoreDNS needs its own mapping. This can be plain,
# git-committed YAML because k3s-management has a fixed IP in
# compose.yaml (172.28.0.104). See docs/network.md.
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
data:
  k3s-management.override: |
    template IN A {
      match "^k3s-management\."
      answer "{{ .Name }} 60 IN A 172.28.0.104"
      fallthrough
    }
